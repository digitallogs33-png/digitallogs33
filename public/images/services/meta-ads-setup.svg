<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="50%" stop-color="#0E1B38" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>
    <radialGradient id="adsGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152445" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B1326" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="adsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#3B82F6" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#adsGlow)" />

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Meta Ads Bullseye & Performance Graph Vector -->
  <g transform="translate(400, 235)">
    <!-- Outer concentric radar ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(0,210,255,0.2)" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(37,99,235,0.4)" stroke-width="2" />

    <!-- Performance Bars -->
    <rect x="-42" y="5" width="16" height="35" rx="4" fill="#1D4ED8" />
    <rect x="-18" y="-15" width="16" height="55" rx="4" fill="#2563EB" />
    <rect x="6" y="-35" width="16" height="75" rx="4" fill="#3B82F6" />
    <rect x="30" y="-55" width="16" height="95" rx="4" fill="url(#adsGrad)" />

    <!-- Upward Trend Arrow -->
    <path d="M-45 10 L-10 -15 L14 -35 L48 -60" fill="none" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
    <polygon points="48,-70 54,-54 36,-60" fill="#00D2FF" />

    <!-- Meta Target Badge floating top right -->
    <circle cx="50" cy="-45" r="16" fill="#1E293B" stroke="#00D2FF" stroke-width="2" />
    <circle cx="50" cy="-45" r="8" fill="#00D2FF" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-115" y="-32" width="230" height="28" rx="14" fill="rgba(37,99,235,0.12)" stroke="rgba(37,99,235,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ADS MANAGEMENT</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Meta Ads Account Setup</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Business Manager • Billing Config • Campaign Architecture</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#38BDF8" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ads Manager</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#00D2FF" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Pre-Warmed</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ready to Spend</text>
  </g>
</svg>
