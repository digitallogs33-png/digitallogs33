<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="50%" stop-color="#0E1934" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <radialGradient id="pixelGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132342" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B1324" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#00D2FF" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#pixelGlow)" />

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#00D2FF" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Pixel & Conversions API Vector Engine -->
  <g transform="translate(400, 235)">
    <!-- Central Hexagonal Hub -->
    <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#0A162B" stroke="#00D2FF" stroke-width="3" />
    
    <!-- Code / Data brackets in center -->
    <text x="0" y="8" fill="#00D2FF" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" text-anchor="middle">&lt;CAPI&gt;</text>

    <!-- Node 1: Browser Pixel -->
    <circle cx="-65" cy="-45" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="-65" y="-41" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">WEB</text>
    <path d="M-52 -38 L-30 -22" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Node 2: Server CAPI -->
    <circle cx="65" cy="-45" r="14" fill="#1E293B" stroke="#818CF8" stroke-width="2" />
    <text x="65" y="-41" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SRV</text>
    <path d="M52 -38 L30 -22" stroke="#818CF8" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Node 3: Event Signal -->
    <circle cx="0" cy="65" r="12" fill="#10B981" stroke="#059669" stroke-width="2" />
    <path d="M0 48 L0 53" stroke="#10B981" stroke-width="3" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-130" y="-32" width="260" height="28" rx="14" fill="rgba(0,210,255,0.12)" stroke="rgba(0,210,255,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#00D2FF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TRACKING &amp; CONVERSIONS</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Meta Pixel &amp; CAPI Integration</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Server-Side Tracking • Event Deduplication • iOS 14+ Ready</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#00D2FF" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Conversions API</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#6366F1" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Deduplication</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Quality Score 9+</text>
  </g>
</svg>
