<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0A1124" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Ambient Cyan & Blue Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#00D2FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0" />
    </radialGradient>

    <!-- Facebook Blue Brand Gradient -->
    <linearGradient id="fbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2880F5" />
      <stop offset="100%" stop-color="#1467DB" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1877F2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00D2FF" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1877F2" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="270" r="320" fill="url(#ambientGlow)" />

  <!-- Geometric Tech Grid Overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>

  <!-- Central Glassmorphism Card Frame -->
  <rect x="230" y="100" width="340" height="340" rx="36" fill="#0B132B" fill-opacity="0.75" stroke="url(#rimGrad)" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Subtle Inner Container Accent Border -->
  <rect x="250" y="120" width="300" height="300" rx="26" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Official Facebook Logo Sphere -->
  <g filter="url(#logoShadow)">
    <!-- Blue Circle -->
    <circle cx="400" cy="270" r="88" fill="url(#fbBlue)" />
    <!-- Authentic Facebook 'f' with lower bleed -->
    <path d="M428 270h23l3.5-35h-26.5v-18c0-9.5 2.5-16 16.5-16h14V170c-2.5-.5-11-1-21-1-21 0-35.5 12.5-35.5 36.5V235H375v35h27v88h36v-88z" fill="#FFFFFF" />
  </g>

  <!-- Accent Status Light -->
  <circle cx="510" cy="160" r="5" fill="#00D2FF" />
  <circle cx="510" cy="160" r="10" fill="#00D2FF" fill-opacity="0.25" />

  <!-- Bottom Brand Typography Block -->
  <text x="400" y="490" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="2">FACEBOOK MARKETING</text>
  <text x="400" y="520" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#00D2FF" letter-spacing="3">ORGANIC REACH &amp; ENGAGEMENT</text>
</svg>
