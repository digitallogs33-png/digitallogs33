<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B14" />
      <stop offset="50%" stop-color="#140E24" />
      <stop offset="100%" stop-color="#080912" />
    </linearGradient>
    <radialGradient id="igGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#D62976" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#962FBF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="igSunset" cx="30%" cy="107%" r="130%">
      <stop offset="0%" stop-color="#fdf497" />
      <stop offset="5%" stop-color="#fdf497" />
      <stop offset="45%" stop-color="#fd5949" />
      <stop offset="60%" stop-color="#d6249f" />
      <stop offset="90%" stop-color="#285AEB" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1630" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#110C1E" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#962FBF" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#igGlow)" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#D62976" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Instagram Camera Glyphs -->
  <g transform="translate(325, 160)">
    <!-- Rounded Camera Outer with Sunset Gradient -->
    <rect x="0" y="0" width="150" height="150" rx="40" fill="url(#igSunset)" />
    <!-- White Camera Outline -->
    <rect x="20" y="20" width="110" height="110" rx="28" fill="none" stroke="#FFFFFF" stroke-width="10" />
    <!-- Lens -->
    <circle cx="75" cy="75" r="26" fill="none" stroke="#FFFFFF" stroke-width="10" />
    <!-- Flash dot -->
    <circle cx="106" cy="44" r="6" fill="#FFFFFF" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-135" y="-32" width="270" height="28" rx="14" fill="rgba(214,41,118,0.12)" stroke="rgba(214,41,118,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#E1306C" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INSTAGRAM MARKETING</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Instagram Followers &amp; Likes</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Real Active Profiles • Viral Reels Views • Auto Likes</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#E1306C" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Non-Drop</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#962FBF" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HQ Avatars</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Safe Delivery</text>
  </g>
</svg>
