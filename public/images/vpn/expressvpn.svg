<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A12" />
      <stop offset="50%" stop-color="#140D14" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>
    <radialGradient id="evpnGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#DA3940" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF5A60" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C141E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F0C12" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="redPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3844" />
      <stop offset="100%" stop-color="#C71520" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#DA3940" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#evpnGlow)" />

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#DA3940" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- ExpressVPN Official Monogram & Emblem -->
  <g transform="translate(400, 235)">
    <!-- Red Rounded Shield / Badge -->
    <rect x="-85" y="-85" width="170" height="170" rx="38" fill="url(#redPill)" />
    <!-- Inner subtle ring -->
    <rect x="-75" y="-75" width="150" height="150" rx="30" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    
    <!-- ExpressVPN iconic 'V' winged emblem -->
    <path d="M-55 -40 L0 52 L55 -40 L28 -40 L0 12 L-28 -40 Z" fill="#FFFFFF" />
    <!-- Secondary inner fold accent -->
    <polygon points="0,52 0,12 28,-40 38,-40" fill="#F1F5F9" opacity="0.9" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-105" y="-32" width="210" height="28" rx="14" fill="rgba(218,57,64,0.12)" stroke="rgba(218,57,64,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#FF5A60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PREMIUM VPN</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">ExpressVPN Private Access</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Lightway Protocol • Ultra Fast Streaming • TrustedServer</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#FF5A60" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Lightway 10G</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#00D2FF" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RAM-Only</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Zero Logs</text>
  </g>
</svg>
