<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#05080F" />
    </linearGradient>
    <radialGradient id="hmaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#00D2FF" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#hmaGlow)" />

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#FFCC00" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- HMA Donkey / Shield Emblem -->
  <g transform="translate(400, 235)">
    <!-- Yellow Circle -->
    <circle cx="0" cy="0" r="85" fill="#FFCC00" />
    
    <!-- Jack's Fedora Hat -->
    <ellipse cx="0" cy="-28" rx="60" ry="10" fill="#202A36" />
    <path d="M-36 -28 C-36 -58 -22 -68 0 -68 C22 -68 36 -58 36 -28 Z" fill="#202A36" />
    <path d="M-34 -34 C-10 -40 10 -40 34 -34" stroke="#FFCC00" stroke-width="4" stroke-linecap="round" />

    <!-- Donkey Face & Sunglasses -->
    <!-- Muzzle / ears -->
    <path d="M-45 -22 L-55 -55 L-35 -30 Z" fill="#202A36" />
    <path d="M45 -22 L55 -55 L35 -30 Z" fill="#202A36" />
    
    <!-- Sunglasses -->
    <path d="M-32 -14 C-32 -2 0 -2 0 -14 C0 -2 32 -2 32 -14 Z" fill="#111827" />
    <polygon points="-32,-16 -4,-16 -8,-2 -28,-2" fill="#0A0E17" />
    <polygon points="4,-16 32,-16 28,-2 8,-2" fill="#0A0E17" />
    <line x1="-5" y1="-12" x2="5" y2="-12" stroke="#111827" stroke-width="3" />
    <!-- White Glint on glasses -->
    <line x1="-24" y1="-12" x2="-12" y2="-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="12" y1="-12" x2="24" y2="-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Trenchcoat collar & tie -->
    <path d="M-40 26 L-15 15 L0 32 L15 15 L40 26 L25 65 L-25 65 Z" fill="#202A36" />
    <!-- Tie -->
    <polygon points="0,32 -6,45 0,68 6,45" fill="#E11D48" />

    <!-- HMA Letters Badge -->
    <rect x="-42" y="52" width="84" height="22" rx="6" fill="#0F172A" stroke="#FFCC00" stroke-width="1.5" />
    <text x="0" y="68" fill="#FFCC00" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">HMA VPN</text>
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-100" y="-32" width="200" height="28" rx="14" fill="rgba(255,204,0,0.12)" stroke="rgba(255,204,0,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#FFCC00" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">VPN SERVICE</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">HMA VPN (HideMyAss)</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">290+ Countries • 20Gbps Fast Speed • Multi-Device</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#FFCC00" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">290+ Countries</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#00D2FF" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">IP Shuffle</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Kill Switch</text>
  </g>
</svg>
