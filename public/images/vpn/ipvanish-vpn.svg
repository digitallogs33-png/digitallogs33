<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C0C" />
      <stop offset="50%" stop-color="#071918" />
      <stop offset="100%" stop-color="#030909" />
    </linearGradient>
    <radialGradient id="ipvGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#44B94C" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2420" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#071614" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ipvGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55D55D" />
      <stop offset="100%" stop-color="#2D9A35" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#44B94C" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#ipvGlow)" />

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#44B94C" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- IPVanish V Chevron Monogram -->
  <g transform="translate(400, 235)">
    <!-- Dark circle background for icon -->
    <circle cx="0" cy="0" r="85" fill="#0A1612" stroke="rgba(68,185,76,0.3)" stroke-width="2" />

    <!-- Intersecting Chevron geometric monogram -->
    <!-- Left green wing -->
    <path d="M-52 -45 L-15 48 L8 48 L-29 -45 Z" fill="url(#ipvGreen)" />
    <!-- Right green wing -->
    <path d="M52 -45 L-4 56 L-16 28 L30 -45 Z" fill="#38B342" />
    <!-- Overlap depth accent -->
    <polygon points="-15,48 -4,56 -16,28" fill="#1B6323" />
    <!-- Inner top accent -->
    <path d="M-15 -35 L0 -2 L15 -35 Z" fill="#A3F0A9" opacity="0.3" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-105" y="-32" width="210" height="28" rx="14" fill="rgba(68,185,76,0.12)" stroke="rgba(68,185,76,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#44B94C" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">HIGH-SPEED VPN</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">IPVanish VPN Premium</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Unmetered Connections • SOCKS5 Proxy • High Speed</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#44B94C" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SOCKS5 Proxy</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#00D2FF" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WireGuard</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">No Throttling</text>
  </g>
</svg>
