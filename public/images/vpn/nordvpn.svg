<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14" />
      <stop offset="50%" stop-color="#0A1830" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>
    <radialGradient id="nordGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4687FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102340" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#091424" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="nordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4687FF" />
      <stop offset="100%" stop-color="#215CD4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#4687FF" stroke-width="1">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800 M0 480 H800 M0 540 H800" />
    <path d="M80 0 V600 M160 0 V600 M240 0 V600 M320 0 V600 M400 0 V600 M480 0 V600 M560 0 V600 M640 0 V600 M720 0 V600" />
  </g>

  <!-- Glow -->
  <circle cx="400" cy="235" r="280" fill="url(#nordGlow)" />

  <!-- Frame -->
  <rect x="24" y="24" width="752" height="552" rx="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <rect x="25" y="25" width="750" height="550" rx="27" fill="none" stroke="#4687FF" stroke-width="1" opacity="0.25" />

  <!-- Central Card Platform -->
  <rect x="270" y="105" width="260" height="260" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- NordVPN Mountain Emblem -->
  <g transform="translate(400, 235)">
    <!-- Blue Circle -->
    <circle cx="0" cy="0" r="85" fill="url(#nordBlue)" />
    <!-- Subtle Inner Ring -->
    <circle cx="0" cy="0" r="77" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

    <!-- Mountain Silhouette -->
    <!-- Center tall peak and surrounding ridges -->
    <path d="M-60 48 L-22 -14 L-6 10 L8 -28 L32 18 L46 0 L60 48 Z" fill="#FFFFFF" />
    <!-- Ridge Shadow Shading -->
    <polygon points="8,-28 8,48 32,18" fill="#DCE7FA" />
    <polygon points="-22,-14 -10,48 -6,10" fill="#DCE7FA" />
    <polygon points="46,0 48,48 60,48" fill="#C5D7F5" />
  </g>

  <!-- Title & Details -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <!-- Category pill -->
    <rect x="-105" y="-32" width="210" height="28" rx="14" fill="rgba(70,135,255,0.12)" stroke="rgba(70,135,255,0.4)" stroke-width="1" />
    <text x="0" y="-14" fill="#4687FF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CYBERSECURITY VPN</text>
    
    <!-- Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">NordVPN Ultimate Privacy</text>
    <text x="0" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">NordLynx WireGuard • Threat Protection • Dedicated IP</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="18" cy="17" r="4" fill="#4687FF" />
    <text x="30" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NordLynx</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="173" cy="17" r="4" fill="#00D2FF" />
    <text x="185" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Threat Shield</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="130" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="328" cy="17" r="4" fill="#10B981" />
    <text x="340" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">60+ Countries</text>
  </g>
</svg>
